
name: Next.js CI/CD with Vercel

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

# Default permissions
permissions:
  contents: read

# Prevent overlapping deployments
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ---------- CI: Build and Test ----------
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build


  # ---------- Preview Deployment ----------
  preview:
    name: Deploy Preview
    needs: build

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Vercel Preview Configuration
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Preview
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy Preview
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Preview deployed: ${{ steps.deploy.outputs.url }}`
            });


  # ---------- Production Deployment ----------
  deploy:
    name: Deploy to Vercel Production
    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Vercel Production Configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Production
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Production
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")

          if [ -z "$DEPLOY_URL" ]; then
            echo "Deployment URL not found!"
            exit 1
          fi

          LIVE_URL="${{ vars.SITE_URL }}"
          LIVE_URL="${LIVE_URL:-$DEPLOY_URL}"

          echo "LIVE_URL=$LIVE_URL" >> "$GITHUB_ENV"

          echo "Production website: $LIVE_URL"

      # ---------- Update README ----------
      - name: Update README Live Website URL
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          readme = Path("README.md")
          live_url = os.environ["LIVE_URL"]

          content = readme.read_text(encoding="utf-8")

          start = "<!-- VERCEL-LIVE-URL:START -->"
          end = "<!-- VERCEL-LIVE-URL:END -->"

          if start not in content or end not in content:
              raise SystemExit("README live URL markers not found!")

          before, remaining = content.split(start, 1)
          _, after = remaining.split(end, 1)

          updated = (
              before
              + start
              + "\n[Visit Live Website](" + live_url + ")\n"
              + end
              + after
          )

          readme.write_text(updated, encoding="utf-8")
          PY

      # ---------- Commit and Push ----------
      - name: Commit and Push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README already up to date."
          else
            git commit -m "docs: update live website URL"

            # Push directly. No unnecessary pull --rebase.
            git push origin HEAD:main

            echo "README updated successfully!"
          fi
