
name: Next.js CI/CD with Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Allow GitHub Actions to update README
permissions:
  contents: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel configuration
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for production
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          set -o pipefail

          npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee deploy.log

          LIVE_URL=$(grep -Eo 'https://[^[:space:]]+' deploy.log | head -n 1 | sed 's/[),]$//')

          if [ -z "$LIVE_URL" ]; then
            echo "Deployment URL not found!"
            exit 1
          fi

          echo "LIVE_URL=$LIVE_URL" >> "$GITHUB_ENV"

          echo "Deployed website: $LIVE_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Update README live website URL
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          readme = Path("README.md")
          live_url = os.environ["LIVE_URL"]

          content = readme.read_text(encoding="utf-8")

          start = "<!-- VERCEL-LIVE-URL:START -->"
          end = "<!-- VERCEL-LIVE-URL:END -->"

          if start not in content or end not in content:
              raise SystemExit("README live URL markers not found!")

          before, remaining = content.split(start, 1)
          _, after = remaining.split(end, 1)

          updated = (
              before
              + start
              + "\n"
              + f"[Visit Live Website]({live_url})\n"
              + end
              + after
          )

          readme.write_text(updated, encoding="utf-8")
          PY

      - name: Commit and Push README Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README already up to date."
          else
            git commit -m "docs: update live website URL"
            git push origin HEAD:main
          fi
